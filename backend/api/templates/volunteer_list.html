{% extends "base.html" %}

{% block title %}
Волонтёры
{% endblock %}

{% block content %}
<h1>Волонтёры</h1>

<ul>
    {% for v in volunteers %}
        <li>
            <a href="{% url 'volunteer_detail' v.pk %}">
                {{ v.user.username }}
            </a>
        </li>
    {% empty %}
        <p>Нет волонтёров.</p>
    {% endfor %}
</ul>
{% endblock %}
