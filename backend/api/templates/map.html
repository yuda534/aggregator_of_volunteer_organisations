<!DOCTYPE html>
<html>
<head>
    <title>Карта мероприятий</title>
    <meta charset="utf-8" />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        #map {
            height: 90vh;
            width: 100%;
        }
    </style>
</head>
<body>

<h1>Карта волонтёрских мероприятий</h1>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Инициализация карты
    const map = L.map('map').setView([55.7558, 37.6173], 5); // центр — Россия

    // Слой карты
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Загрузка событий
    fetch('/events/')
        .then(response => response.json())
        .then(events => {
            events.forEach(event => {
                if (event.latitude && event.longitude) {
                    L.marker([event.latitude, event.longitude])
                        .addTo(map)
                        .bindPopup(
                            `<b>${event.title}</b><br>${event.location}`
                        );
                }
            });
        });
</script>

</body>
</html>
