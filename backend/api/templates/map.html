<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта мероприятий</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            padding: 10px;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 85vh;
        }
    </style>

    <script
        src="https://api-maps.yandex.ru/2.1/?apikey={{ YANDEX_MAPS_API_KEY }}&lang=ru_RU"
        type="text/javascript">
    </script>
</head>
<body>

<h1>Карта волонтёрских мероприятий</h1>
<div id="map"></div>

<script>
    ymaps.ready(init);

    function init() {
        const map = new ymaps.Map("map", {
            center: [55.7558, 37.6173], // центр — Москва
            zoom: 5
        });

        // Загружаем мероприятия из API
        fetch('/api/events/')
            .then(response => response.json())
            .then(events => {
                events.forEach(event => {
                    if (event.latitude && event.longitude) {
                        const placemark = new ymaps.Placemark(
                            [event.latitude, event.longitude],
                            {
                                balloonContent: `
                                    <strong>${event.title}</strong><br>
                                    ${event.location}
                                `
                            }
                        );
                        map.geoObjects.add(placemark);
                    }
                });
            });
    }
</script>

</body>
</html>
