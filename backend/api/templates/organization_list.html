{% extends "base.html" %}

{% block title %}
Организации
{% endblock %}

{% block content %}
<h1>Организации</h1>

<ul>
    {% for org in organizations %}
        <li>
            <a href="{% url 'organization_detail' org.pk %}">
                {{ org.name }}
            </a>
        </li>
    {% empty %}
        <p>Нет организаций.</p>
    {% endfor %}
</ul>
{% endblock %}
