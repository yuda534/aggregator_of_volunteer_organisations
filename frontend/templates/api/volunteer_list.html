<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Волонтёры</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .actions a {
            text-decoration: none;
            color: #0066cc;
            font-size: 14px;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .empty {
            background: #ffffff;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Волонтёры</h1>

    {% if volunteers %}
        <div class="list">
            {% for volunteer in volunteers %}
                <div class="card">
                    <div class="card-title">
                        {{ volunteer.user.get_full_name|default:volunteer.user.username }}
                    </div>

                    <div class="meta">
                        {% if volunteer.user.email %}
                            📧 {{ volunteer.user.email }}
                        {% endif %}
                    </div>

                    <div class="actions">
                        <a href="{% url 'volunteer_detail' volunteer.id %}">
                            Подробнее
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">
            Волонтёры пока не добавлены
        </div>
    {% endif %}
</div>

</body>
</html>
