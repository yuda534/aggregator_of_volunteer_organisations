<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мероприятия</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .event-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .event-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-description {
            color: #555;
            margin-bottom: 10px;
        }

        .event-meta {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }

        .details-link {
            align-self: flex-start;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }

        .details-link:hover {
            text-decoration: underline;
        }

        .empty {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #0066cc;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Активные мероприятия</h1>

    {% if events %}
        <div class="event-list">
            {% for event in events %}
                <div class="event-card">
                    <div>
                        <div class="event-title">
                            {{ event.title }}
                        </div>

                        <div class="event-description">
                            {{ event.description|truncatechars:150 }}
                        </div>

                        <div class="event-meta">
                            <div>
                                📅 {{ event.start_date|date:"d.m.Y H:i" }}
                            </div>
                            <div>
                                📍 {{ event.location }}
                            </div>
                        </div>
                    </div>

                    <a
                        href="{% url 'event_detail' event.id %}"
                        class="details-link"
                    >
                        Подробнее →
                    </a>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">
            Пока нет активных мероприятий.
        </div>
    {% endif %}

    <a href="/" class="back-link">← На главную</a>
</div>

</body>
</html>
