<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта мероприятий</title>

    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
        }

        .header {
            padding: 15px 20px;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Карта волонтёрских мероприятий</h1>
</div>

<div id="map"></div>

<script>
    ymaps.ready(init);

    function init() {
        const map = new ymaps.Map("map", {
            center: [55.751574, 37.573856],
            zoom: 10
        });

        {% for event in events %}
            map.geoObjects.add(
                new ymaps.Placemark(
                    [{{ event.latitude }}, {{ event.longitude }}],
                    {
                        balloonContent: `
                            <strong>{{ event.title }}</strong><br>
                            {{ event.location }}<br>
                            <a href="/events/{{ event.id }}/">Открыть мероприятие</a>
                        `
                    }
                )
            );
        {% endfor %}
    }
</script>

</body>
</html>
