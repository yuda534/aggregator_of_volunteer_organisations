{% extends "base.html" %}
{% block title %}Карта мероприятий — Go2Help{% endblock %}

{% block content %}

{% include 'includes/back_button.html' %}

<div class="container-fluid px-0">
    <div class="map-header text-center py-4">
        <h1 class="fw-bold">Карта мероприятий</h1>
        <p class="text-muted">
            Актуальные волонтёрские мероприятия на карте
        </p>
    </div>

    <div id="map" style="width: 100%; height: 80vh;"></div>
</div>

<!-- Yandex Maps API -->
<script src="https://api-maps.yandex.ru/2.1/?apikey={{ YANDEX_MAPS_API_KEY }}&lang=ru_RU"></script>

<script>
    ymaps.ready(init);

    function init() {
        const map = new ymaps.Map("map", {
            center: [55.751244, 37.618423], // Москва по умолчанию
            zoom: 10,
            controls: ['zoomControl', 'fullscreenControl']
        });

        {% for event in events %}
            const placemark{{ event.id }} = new ymaps.Placemark(
                [{{ event.latitude }}, {{ event.longitude }}],
                {
                    balloonContentHeader: "<strong>{{ event.title }}</strong>",
                    balloonContentBody: `
                        <p>{{ event.description|truncatechars:120 }}</p>
                        <p><strong>Начало:</strong> {{ event.start_date }}</p>
                        <a href="{% url 'event_detail' event.id %}" class="btn btn-sm btn-primary mt-2">
                            Подробнее
                        </a>
                    `
                },
                {
                    preset: 'islands#redIcon'
                }
            );

            map.geoObjects.add(placemark{{ event.id }});
        {% endfor %}
    }
</script>
{% endblock %}
