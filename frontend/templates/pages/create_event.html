{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5" style="max-width: 800px;">

    <h2 class="mb-4">Создание мероприятия</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Название -->
        <div class="mb-3">
            <label class="form-label"><strong>Название мероприятия</strong></label>
            {{ form.title }}
        </div>

        <!-- Описание -->
        <div class="mb-3">
            <label class="form-label"><strong>Описание</strong></label>
            {{ form.description }}
        </div>

        <!-- Дата начала -->
        <div class="mb-3">
            <label class="form-label"><strong>Дата начала</strong></label>
            {{ form.start_date }}
        </div>

        <!-- Дата окончания -->
        <div class="mb-3">
            <label class="form-label"><strong>Дата окончания</strong></label>
            {{ form.end_date }}
        </div>

        <!-- Количество волонтёров -->
        <div class="mb-3">
            <label class="form-label"><strong>Количество волонтёров</strong></label>
            {{ form.required_volunteers }}
        </div>

        <!-- Адрес -->
        <div class="mb-3">
            <label class="form-label"><strong>Адрес</strong></label>
            {{ form.location }}
        </div>

        <!-- Карта -->
        <div class="mb-3">
            <label class="form-label"><strong>Местоположение на карте</strong></label>
            <div id="map"
                 style="height: 300px;"
                 class="border rounded">
            </div>
        </div>

        <!-- Скрытые поля координат -->
        {{ form.latitude }}
        {{ form.longitude }}

        <button type="submit" class="btn btn-primary mt-3">
            Создать мероприятие
        </button>
    </form>
</div>

<!-- Яндекс.Карта -->
<script>
    ymaps.ready(init);

    function init() {
        const map = new ymaps.Map("map", {
            center: [55.751574, 37.573856], // Москва
            zoom: 10
        });

        let placemark = null;

        map.events.add('click', function (e) {
            const coords = e.get('coords');

            if (placemark) {
                placemark.geometry.setCoordinates(coords);
            } else {
                placemark = new ymaps.Placemark(coords, {}, {
                    preset: 'islands#redIcon',
                    draggable: true
                });

                map.geoObjects.add(placemark);

                placemark.events.add('dragend', function () {
                    const newCoords = placemark.geometry.getCoordinates();
                    setCoordinates(newCoords);
                });
            }

            setCoordinates(coords);
        });

        function setCoordinates(coords) {
            document.getElementById('id_latitude').value = coords[0];
            document.getElementById('id_longitude').value = coords[1];
        }
    }
</script>

{% endblock %}
